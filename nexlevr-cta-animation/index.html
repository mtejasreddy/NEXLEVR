<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexLevr CTA Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <section class="cta-section">
        <p class="eyebrow">BUILD YOUR NEXT LEVEL</p>
        <h1>
          Learn faster.<br />
          Build proof.
        </h1>

        <p class="description">
          Turn your learning into visible work through practical challenges and
          projects you can share.
        </p>

        <a href="#start" class="cta-button" aria-label="Start learning">
          <span class="button-text">Start learning</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </a>

        <p class="hint">Hover over the CTA button</p>
      </section>
    </main>
  </body>
</html>
